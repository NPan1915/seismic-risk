name: refresh-data
on:
  schedule: [{ cron: "0 6 * * 1" }]   # Mondays 06:00 UTC
  workflow_dispatch:                  # also lets you run it by hand
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python refresh.py
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - name: Commit updated data
        run: |
          git config user.name "refresh-bot"; git config user.email "refresh-bot@users.noreply.github.com"
          git add vercel-site/public/zones.json vercel-site/public/metrics.json
          git diff --cached --quiet || (git commit -m "Update zones $(date -u +%F)" && git push)
