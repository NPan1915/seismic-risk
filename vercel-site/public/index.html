<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Seismic Risk Globe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#05070d;--fg:#e8ecf4;--mut:#8b95a8;--panel:#0d1220cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block}
.hud{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel);padding:12px 14px;border-radius:10px;width:270px;max-width:calc(100% - 32px);font-size:13px;line-height:1.4}
.hud h1{font-size:15px;margin:0 0 4px}.hud p{margin:4px 0;color:var(--mut)}
#tip{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:8px 12px;border-radius:8px;font-size:13px;max-width:min(420px,calc(100% - 32px))}
label.b{display:inline-block;margin:6px 4px 0 0;padding:5px 9px;border:1px solid #334;border-radius:6px;cursor:pointer;font-size:12px;user-select:none}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#ffc2b3,#ff2a2a,#a8001a);margin:8px 0 2px}
.row{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
input[type=range]{width:100%;margin:4px 0 0}
</style></head><body>
<div class="hud"><h1>Seismic risk zones</h1>
<p>Big circles group nearby zones; <b>zoom in</b> (scroll or +) to split them into individual zones. Color = <span id="legCap">volatility</span> of the area.</p>
<div class="bar"></div><div class="row"><span>lower</span><span>higher</span></div>
<div style="margin-top:8px">Min risk: <b id="minRL">30%</b><input id="minR" type="range" min="0" max="90" value="30"></div>
<p id="src">Showing illustrative sample data.</p><p id="cnt"></p>
<label class="b" id="modeBtn">Color: volatility</label><label class="b" id="spinBtn">Spin: on</label>
<label class="b" id="zi">+</label><label class="b" id="zo">&minus;</label>
<label class="b">Load zones.json<input id="f" type="file" accept=".json" hidden></label></div>
<div id="tip">Hover a circle or dot</div>

 :`Risk ${u.risk*100|0}% \u00b7 volatility ${u.vol.toFixed(2)} \u00b7 max M${u.maxmag}`+(u.pop!==undefined?` \u00b7 ${u.pop}M people within 100 km`:'')+(u.accel?` \u00b7 rate-rise prob ${u.accel}`:'');
function hover(cx,cy){const h=pick(cx,cy);if(hov&&hov!==h)hov.scale.setScalar(hov.userData.s);hov=h;
 if(h)h.scale.setScalar(h.userData.s*(h.userData.k>1?1.15:1.9));
 tip.textContent=h?fmt(h.userData):'Hover a circle or dot'}
el.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;lastMove=performance.now();hover(e.clientX,e.clientY)};onpointerup=()=>drag=false;
onpointermove=e=>{lastMove=performance.now();
 if(drag){globe.rotation.y+=(e.clientX-px)*.005;globe.rotation.x=Math.max(-1.4,Math.min(1.4,globe.rotation.x+(e.clientY-py)*.005));px=e.clientX;py=e.clientY}
 else hover(e.clientX,e.clientY)};
el.onwheel=e=>{e.preventDefault();zoom(e.deltaY*.3)};
zi.onclick=()=>zoom(-60);zo.onclick=()=>zoom(60);
spinBtn.onclick=()=>{spin=!spin;spinBtn.textContent='Spin: '+(spin?'on':'off')};
modeBtn.onclick=()=>{mode=mode==='vol'?'impact':'vol';modeBtn.textContent='Color: '+(mode==='vol'?'volatility':'human impact');legCap.textContent=mode==='vol'?'volatility':'human impact';build()};
minR.oninput=()=>{minRisk=minR.value/100;minRL.textContent=minR.value+'%';build()};
function setZones(j,msg){zones=j;prep();build();src.textContent=msg}
f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());setZones(j,j.length+' zones loaded from your model.')}catch(e){src.textContent='Could not read that file.'}};
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)};
globe.rotation.y=-2.4;globe.rotation.x=.3;prep();level=lvl();build();
fetch('zones.json').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.length)setZones(j,j.length+' zones from the live model.')}).catch(()=>{});
(function loop(){requestAnimationFrame(loop);if(!drag&&spin&&!hov&&performance.now()-lastMove>2500)globe.rotation.y+=vy;ren.render(scene,cam)})();
</script></body></html>
